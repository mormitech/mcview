<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>mcView</title>
</head>
<body>
<main id="viewer">
    <div id="stage"><img id="pic" alt="" hidden draggable="false"><div id="sel" hidden><svg class="ants" aria-hidden="true"><rect class="k" x=".5" y=".5" width="100%" height="100%"/><rect class="w" x=".5" y=".5" width="100%" height="100%"/></svg><i class="edge t"></i><i class="edge b"></i><i class="edge l"></i><i class="edge r"></i></div></div>
    <div id="empty">
        <img class="logo" src="./src/assets/mormitech-mark.svg" alt="" width="120">
        <h1>mcView</h1>
        <p class="muted" id="hint"></p>
        <button id="open">Open picture…</button>
    </div>
    <div id="status" hidden><span id="name"></span><span id="folder"></span><span id="pixel" hidden></span><span id="info"></span></div>
</main>
<div id="about" hidden></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
